name: E2E

on:
  pull_request:
    paths:
      - "e2e/**"
      - "playwright.config.ts"
      - "src/components/pages/planejador/**"
      - "src/lib/shared/planner/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aquario
          POSTGRES_PASSWORD: aquario
          POSTGRES_DB: aquario
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # .env.example already points DATABASE_URL at aquario:aquario@localhost:5432/aquario and
      # leaves RESEND_API_KEY unset, so accounts are auto-verified.
      - name: Create .env
        run: cp .env.example .env

      - name: Prepare database
        run: |
          npm run db:generate
          npm run db:migrate:deploy
          npx dotenv -e .env -- tsx prisma/seed.ts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
