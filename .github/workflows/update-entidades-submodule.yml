name: Update Entidades Submodule

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: "Custom commit message (optional)"
        required: false
        default: "chore: update aquario-entidades submodule"

permissions:
  contents: write

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    environment: repository-maintenance
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.MAINTENANCE_TOKEN_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update submodule
        run: |
          echo "🔄 Updating aquario-entidades submodule..."
          cd content/aquario-entidades
          git fetch origin
          git checkout origin/main
          cd ../..
          git add content/aquario-entidades

          echo "✅ Submodule updated!"
          echo ""
          echo "Current submodule commit:"
          cd content/aquario-entidades
          git log -1 --oneline
          cd ../..

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet HEAD; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes detected - submodule is already up to date!"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📝 Changes detected in submodule"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.MAINTENANCE_TOKEN_PAT || secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          git add content/aquario-entidades
          git commit -m "$COMMIT_MESSAGE"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git push
          echo "✅ Changes committed and pushed to main!"

      - name: No changes summary
        if: steps.check_changes.outputs.changed == 'false'
        run: |
          echo "✅ Workflow completed - no updates needed"
