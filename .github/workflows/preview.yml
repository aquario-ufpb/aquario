name: Preview Deployment

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: nonproduction-preview
    env:
      MODE: preview
      PR_ACTION: ${{ github.event.action }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      NONPROD_NEON_PROJECT_ID: ${{ vars.NONPROD_NEON_PROJECT_ID }}
      PRODUCTION_NEON_PROJECT_ID: ${{ vars.PRODUCTION_NEON_PROJECT_ID }}
      PREVIEW_VERCEL_PROJECT_ID: ${{ vars.PREVIEW_VERCEL_PROJECT_ID }}
      STAGING_VERCEL_PROJECT_ID: ${{ vars.STAGING_VERCEL_PROJECT_ID }}
      PRODUCTION_VERCEL_PROJECT_ID: ${{ vars.PRODUCTION_VERCEL_PROJECT_ID }}
      NONPROD_VERCEL_ORG_ID: ${{ vars.NONPROD_VERCEL_ORG_ID }}
    steps:
      # Only reviewed control code runs on this runner. Vercel builds the PR SHA remotely.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Check whether the event still matches the PR
        id: current
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: context.issue.number
            });
            return context.payload.action === 'closed'
              ? pr.state === 'closed'
              : pr.state === 'open' && pr.head.sha === context.payload.pull_request.head.sha;

      - name: Deploy or clean up the preview
        if: steps.current.outputs.result == 'true'
        id: preview
        env:
          NONPROD_NEON_API_KEY: ${{ secrets.NONPROD_NEON_API_KEY }}
          NONPROD_VERCEL_TOKEN: ${{ secrets.NONPROD_VERCEL_TOKEN }}
        run: python3 scripts/ci/nonproduction.py

      - name: Remove replaced preview databases
        if: success() && steps.current.outputs.result == 'true' && github.event.action != 'closed'
        env:
          NONPROD_NEON_API_KEY: ${{ secrets.NONPROD_NEON_API_KEY }}
        run: python3 scripts/ci/nonproduction.py previous

      - name: Comment preview URL
        if: success() && steps.current.outputs.result == 'true' && github.event.action != 'closed'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const issue = { ...context.repo, issue_number: context.issue.number };
            const marker = '<!-- aquario-preview -->';
            const body = marker + '\nPreview: ' + process.env.PREVIEW_URL;
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const previous = comments.find(c => c.user?.login === 'github-actions[bot]' &&
              (c.body?.startsWith(marker) || c.body?.startsWith('## 🚀 Preview Deployment')));
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }
