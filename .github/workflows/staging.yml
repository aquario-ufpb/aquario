name: Staging Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Reset Neon staging branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          # Get all branches
          BRANCHES=$(curl -s -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches")

          # Find staging branch
          STAGING_ID=$(echo "$BRANCHES" | jq -r '.branches[] | select(.name == "staging") | .id')

          # Find main branch (parent)
          MAIN_ID=$(echo "$BRANCHES" | jq -r '.branches[] | select(.name == "main") | .id')

          if [ -n "$STAGING_ID" ]; then
            echo "Deleting old staging branch..."
            DELETE_RESPONSE=$(curl -s -w "\n%{http_code}" -X DELETE -H "Authorization: Bearer $NEON_API_KEY" \
              "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$STAGING_ID")

            HTTP_CODE=$(echo "$DELETE_RESPONSE" | tail -1)
            if [ "$HTTP_CODE" -ge 400 ]; then
              echo "::error::Failed to delete staging branch (HTTP $HTTP_CODE)"
              echo "$DELETE_RESPONSE" | head -n -1
              exit 1
            fi

            echo "Staging branch deleted"
            sleep 2
          fi

          echo "Creating fresh staging branch from main with endpoint..."
          RESPONSE=$(curl -s -X POST -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"branch\": {\"name\": \"staging\", \"parent_id\": \"$MAIN_ID\"}, \"endpoints\": [{\"type\": \"read_write\"}]}" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches")

          echo "Staging branch recreated"
          echo "$RESPONSE" | jq .

      - name: Get staging database URL
        id: db-url
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          # Get staging branch
          BRANCHES=$(curl -s -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches")

          STAGING_ID=$(echo "$BRANCHES" | jq -r '.branches[] | select(.name == "staging") | .id')

          if [ -z "$STAGING_ID" ] || [ "$STAGING_ID" == "null" ]; then
            echo "::error::Staging branch not found"
            exit 1
          fi

          # Wait for endpoint to be ready (poll up to 60 seconds)
          echo "Waiting for endpoint to be ready..."
          for i in {1..12}; do
            ENDPOINTS=$(curl -s -H "Authorization: Bearer $NEON_API_KEY" \
              "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$STAGING_ID/endpoints")

            ENDPOINT_STATUS=$(echo "$ENDPOINTS" | jq -r '.endpoints[0].current_state // "pending"')
            echo "Attempt $i: Endpoint status: $ENDPOINT_STATUS"

            if [ "$ENDPOINT_STATUS" == "idle" ] || [ "$ENDPOINT_STATUS" == "active" ]; then
              echo "Endpoint is ready"
              break
            fi

            if [ $i -eq 12 ]; then
              echo "::error::Endpoint not ready after 60 seconds"
              exit 1
            fi

            sleep 5
          done

          # Get database and role info
          DATABASES=$(curl -s -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$STAGING_ID/databases")
          DB_NAME=$(echo "$DATABASES" | jq -r '.databases[0].name')

          ROLES=$(curl -s -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$STAGING_ID/roles")
          ROLE_NAME=$(echo "$ROLES" | jq -r '.roles[] | select(.protected == false) | .name' | head -1)

          echo "Database: $DB_NAME, Role: $ROLE_NAME"

          # Get connection URI
          CONN=$(curl -s -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/connection_uri?branch_id=$STAGING_ID&role_name=$ROLE_NAME&database_name=$DB_NAME")

          DB_URL=$(echo "$CONN" | jq -r '.uri')

          if [ -z "$DB_URL" ] || [ "$DB_URL" == "null" ]; then
            echo "::error::Failed to get connection URI"
            echo "$CONN"
            exit 1
          fi

          echo "url=$DB_URL" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ steps.db-url.outputs.url }}

      - name: Purge inherited SIGAA data
        run: npx prisma db execute --file scripts/sql/clear-sigaa-staging.sql
        env:
          DATABASE_URL: ${{ steps.db-url.outputs.url }}

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Validate isolated SIGAA staging secrets
        env:
          STAGING_SIGAA_REAUTH_JWT_SECRET: ${{ secrets.STAGING_SIGAA_REAUTH_JWT_SECRET }}
          STAGING_SIGAA_CONNECTOR_URL: ${{ secrets.STAGING_SIGAA_CONNECTOR_URL }}
          STAGING_SIGAA_CONNECTOR_ALLOWED_ORIGINS: ${{ secrets.STAGING_SIGAA_CONNECTOR_ALLOWED_ORIGINS }}
          STAGING_SIGAA_CONNECTOR_API_SECRET: ${{ secrets.STAGING_SIGAA_CONNECTOR_API_SECRET }}
        run: |
          for name in \
            STAGING_SIGAA_REAUTH_JWT_SECRET \
            STAGING_SIGAA_CONNECTOR_URL \
            STAGING_SIGAA_CONNECTOR_ALLOWED_ORIGINS \
            STAGING_SIGAA_CONNECTOR_API_SECRET
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required for isolated SIGAA staging"
              exit 1
            fi
          done

      - name: Deploy to Vercel (Staging)
        id: deploy
        env:
          STAGING_SIGAA_REAUTH_JWT_SECRET: ${{ secrets.STAGING_SIGAA_REAUTH_JWT_SECRET }}
          STAGING_SIGAA_CONNECTOR_URL: ${{ secrets.STAGING_SIGAA_CONNECTOR_URL }}
          STAGING_SIGAA_CONNECTOR_ALLOWED_ORIGINS: ${{ secrets.STAGING_SIGAA_CONNECTOR_ALLOWED_ORIGINS }}
          STAGING_SIGAA_CONNECTOR_API_SECRET: ${{ secrets.STAGING_SIGAA_CONNECTOR_API_SECRET }}
        run: |
          URL=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }} \
            --env DATABASE_URL="${{ steps.db-url.outputs.url }}" \
            --env NEXT_PUBLIC_IS_STAGING="true" \
            --env SIGAA_REAUTH_JWT_SECRET="$STAGING_SIGAA_REAUTH_JWT_SECRET" \
            --env SIGAA_CONNECTOR_URL="$STAGING_SIGAA_CONNECTOR_URL" \
            --env SIGAA_CONNECTOR_ALLOWED_ORIGINS="$STAGING_SIGAA_CONNECTOR_ALLOWED_ORIGINS" \
            --env SIGAA_CONNECTOR_API_SECRET="$STAGING_SIGAA_CONNECTOR_API_SECRET" \
            --build-env DATABASE_URL="${{ steps.db-url.outputs.url }}" \
            --build-env NEXT_PUBLIC_IS_STAGING="true")

          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Alias to staging domain
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail

          DEPLOY_URL="${{ steps.deploy.outputs.url }}"
          DEPLOY_HOST="${DEPLOY_URL#https://}"
          ALIAS_NAME="staging.aquarioufpb.com"

          echo "Getting deployment ID for: $DEPLOY_HOST"

          RESPONSE=$(curl --fail-with-body -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${DEPLOY_HOST}?teamId=${VERCEL_ORG_ID}")

          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.id')

          if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" == "null" ]; then
            echo "::error::Could not resolve the deployment ID for $DEPLOY_HOST"
            exit 1
          fi

          echo "Deployment ID: $DEPLOY_ID"

          ALIAS_RESULT=$(curl -sS -w '\n%{http_code}' -X POST \
            "https://api.vercel.com/v2/deployments/${DEPLOY_ID}/aliases?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"alias\": \"${ALIAS_NAME}\"}")
          ALIAS_STATUS=$(echo "$ALIAS_RESULT" | tail -n 1)
          ALIAS_RESPONSE=$(echo "$ALIAS_RESULT" | sed '$d')

          echo "Alias response: $ALIAS_RESPONSE"

          if [ "$ALIAS_STATUS" != "200" ] && [ "$ALIAS_STATUS" != "409" ]; then
            echo "::error::Alias request failed with HTTP $ALIAS_STATUS: $(echo "$ALIAS_RESPONSE" | jq -r '.error.message // "unknown error"')"
            exit 1
          fi

          VERIFIED_ALIAS=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v4/aliases/${ALIAS_NAME}?teamId=${VERCEL_ORG_ID}")
          VERIFIED_DEPLOY_ID=$(echo "$VERIFIED_ALIAS" | jq -r '.deploymentId')
          if [ "$VERIFIED_DEPLOY_ID" != "$DEPLOY_ID" ]; then
            echo "::error::Staging alias points to $VERIFIED_DEPLOY_ID instead of $DEPLOY_ID"
            exit 1
          fi

          echo "✅ Alias set successfully"

      - name: Summary
        run: |
          echo "## 🎭 Staging Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://staging.aquarioufpb.com" >> $GITHUB_STEP_SUMMARY
          echo "**Vercel URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
