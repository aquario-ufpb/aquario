name: Staging Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: staging
    env:
      MODE: staging
      NONPROD_NEON_PROJECT_ID: ${{ vars.NONPROD_NEON_PROJECT_ID }}
      PRODUCTION_NEON_PROJECT_ID: ${{ vars.PRODUCTION_NEON_PROJECT_ID }}
      PREVIEW_VERCEL_PROJECT_ID: ${{ vars.PREVIEW_VERCEL_PROJECT_ID }}
      STAGING_VERCEL_PROJECT_ID: ${{ vars.STAGING_VERCEL_PROJECT_ID }}
      PRODUCTION_VERCEL_PROJECT_ID: ${{ vars.PRODUCTION_VERCEL_PROJECT_ID }}
      VERCEL_PROJECT_ID: ${{ vars.STAGING_VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ vars.NONPROD_VERCEL_ORG_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Validate isolated SIGAA staging secrets
        env:
          NONPROD_VERCEL_TOKEN: ${{ secrets.NONPROD_VERCEL_TOKEN }}
          STAGING_SIGAA_REAUTH_JWT_SECRET: ${{ secrets.STAGING_SIGAA_REAUTH_JWT_SECRET }}
          STAGING_SIGAA_CONNECTOR_URL: ${{ secrets.STAGING_SIGAA_CONNECTOR_URL }}
          STAGING_SIGAA_CONNECTOR_ALLOWED_ORIGINS: ${{ secrets.STAGING_SIGAA_CONNECTOR_ALLOWED_ORIGINS }}
          STAGING_SIGAA_CONNECTOR_API_SECRET: ${{ secrets.STAGING_SIGAA_CONNECTOR_API_SECRET }}
        run: |
          for name in VERCEL_ORG_ID NONPROD_VERCEL_TOKEN \
            STAGING_SIGAA_REAUTH_JWT_SECRET \
            STAGING_SIGAA_CONNECTOR_URL \
            STAGING_SIGAA_CONNECTOR_ALLOWED_ORIGINS \
            STAGING_SIGAA_CONNECTOR_API_SECRET
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required for isolated SIGAA staging"
              exit 1
            fi
          done

      - name: Provision isolated staging database
        id: db-url
        env:
          NONPROD_NEON_API_KEY: ${{ secrets.NONPROD_NEON_API_KEY }}
        run: python3 scripts/ci/nonproduction.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ steps.db-url.outputs.url }}

      - name: Load synthetic staging seed
        run: npx prisma db seed
        env:
          DATABASE_URL: ${{ steps.db-url.outputs.url }}

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (Staging)
        id: deploy
        env:
          DATABASE_URL: ${{ steps.db-url.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.NONPROD_VERCEL_TOKEN }}
          STAGING_SIGAA_REAUTH_JWT_SECRET: ${{ secrets.STAGING_SIGAA_REAUTH_JWT_SECRET }}
          STAGING_SIGAA_CONNECTOR_URL: ${{ secrets.STAGING_SIGAA_CONNECTOR_URL }}
          STAGING_SIGAA_CONNECTOR_ALLOWED_ORIGINS: ${{ secrets.STAGING_SIGAA_CONNECTOR_ALLOWED_ORIGINS }}
          STAGING_SIGAA_CONNECTOR_API_SECRET: ${{ secrets.STAGING_SIGAA_CONNECTOR_API_SECRET }}
        run: |
          URL=$(vercel deploy --target=preview --token="$VERCEL_TOKEN" \
            --env DATABASE_URL="$DATABASE_URL" \
            --env NEXT_PUBLIC_IS_STAGING="true" \
            --env SIGAA_REAUTH_JWT_SECRET="$STAGING_SIGAA_REAUTH_JWT_SECRET" \
            --env SIGAA_CONNECTOR_URL="$STAGING_SIGAA_CONNECTOR_URL" \
            --env SIGAA_CONNECTOR_ALLOWED_ORIGINS="$STAGING_SIGAA_CONNECTOR_ALLOWED_ORIGINS" \
            --env SIGAA_CONNECTOR_API_SECRET="$STAGING_SIGAA_CONNECTOR_API_SECRET" \
            --build-env DATABASE_URL="$DATABASE_URL" \
            --build-env NEXT_PUBLIC_IS_STAGING="true")

          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Alias to staging domain
        id: alias
        env:
          VERCEL_TOKEN: ${{ secrets.NONPROD_VERCEL_TOKEN }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail

          DEPLOY_HOST="${DEPLOY_URL#https://}"
          ALIAS_NAME="staging.aquarioufpb.com"

          echo "Getting deployment ID for: $DEPLOY_HOST"

          RESPONSE=$(curl --fail-with-body -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${DEPLOY_HOST}?teamId=${VERCEL_ORG_ID}")

          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.id')

          if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" == "null" ]; then
            echo "::error::Could not resolve the deployment ID for $DEPLOY_HOST"
            exit 1
          fi

          echo "Deployment ID: $DEPLOY_ID"

          ALIAS_RESULT=$(curl -sS -w '\n%{http_code}' -X POST \
            "https://api.vercel.com/v2/deployments/${DEPLOY_ID}/aliases?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"alias\": \"${ALIAS_NAME}\"}")
          ALIAS_STATUS=$(echo "$ALIAS_RESULT" | tail -n 1)

          if [ "$ALIAS_STATUS" != "200" ] && [ "$ALIAS_STATUS" != "409" ]; then
            echo "::error::Alias request failed with HTTP $ALIAS_STATUS"
            exit 1
          fi

          VERIFIED_ALIAS=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v4/aliases/${ALIAS_NAME}?teamId=${VERCEL_ORG_ID}")
          VERIFIED_DEPLOY_ID=$(echo "$VERIFIED_ALIAS" | jq -r '.deploymentId')
          if [ "$VERIFIED_DEPLOY_ID" != "$DEPLOY_ID" ]; then
            echo "::error::Staging alias points to $VERIFIED_DEPLOY_ID instead of $DEPLOY_ID"
            exit 1
          fi

          echo "✅ Alias set successfully"

      - name: Remove the failed staging database before alias promotion
        if: >-
          (failure() || cancelled()) && steps.db-url.outcome != 'skipped' &&
          steps.alias.outcome == 'skipped'
        env:
          NONPROD_NEON_API_KEY: ${{ secrets.NONPROD_NEON_API_KEY }}
        run: python3 scripts/ci/nonproduction.py failed

      - name: Remove replaced staging databases
        env:
          NONPROD_NEON_API_KEY: ${{ secrets.NONPROD_NEON_API_KEY }}
        run: python3 scripts/ci/nonproduction.py previous

      - name: Summary
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "## 🎭 Staging Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://staging.aquarioufpb.com" >> $GITHUB_STEP_SUMMARY
          echo "**Vercel URL:** $DEPLOY_URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
